# One-click: save the official website logo into the repo (assets/brand/).
name: Fetch logo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p assets/brand
          curl -fsSL -A "MudraMonkBuild/1.0" -o assets/brand/mudra-monk-logo.png https://mudramonk.com/wp-content/uploads/2026/11/mudra-monk-icon.png
          file assets/brand/mudra-monk-logo.png
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add assets/brand && git commit -m "Add official logo [skip ci]" || exit 0
          git push
